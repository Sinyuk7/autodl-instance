# Torch 算力引擎配置
# NVIDIA 驱动与 CUDA 版本基线约束 + PyTorch 安装源

# NVIDIA 驱动最低版本要求 (主版本号)
min_driver_version: 580

# CUDA 最低版本要求 (用于幂等性检查)
min_cuda_version: 13.0

# PyTorch CUDA 13.0 wheel source
index_url: "https://download.pytorch.org/whl/cu130"

# Stable, mutually compatible versions verified against the CUDA 13.0 index.
packages:
  - "torch==2.11.0+cu130"
  - "torchvision==0.26.0+cu130"
  - "torchaudio==2.11.0+cu130"
